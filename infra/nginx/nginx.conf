worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;

  # Request size and slow-client limits
  client_max_body_size 2m;
  client_body_timeout 15s;
  client_header_timeout 15s;
  send_timeout 30s;

  # Upstream timeouts (backend queries are bounded by CH_QUERY_TIMEOUT_SECONDS)
  proxy_connect_timeout 5s;
  proxy_send_timeout 60s;
  proxy_read_timeout 60s;

  # Coarse per-IP rate limits in front of the backend's own limiter
  limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
  limit_req_zone $binary_remote_addr zone=sensitive:10m rate=2r/s;
  limit_req_status 429;
  limit_conn_zone $binary_remote_addr zone=perip:10m;

  # Keep a client-supplied correlation id, otherwise use nginx's own request id.
  map $http_x_request_id $correlation_id {
    default $http_x_request_id;
    "" $request_id;
  }

  map $http_upgrade $connection_upgrade {
    default upgrade;
    "" close;
  }

  # Re-resolve the backend through Docker's DNS so a recreated backend container
  # (new IP) does not leave the proxy pointing at a stale address.
  resolver 127.0.0.11 valid=10s ipv6=off;
  resolver_timeout 5s;

  upstream backend_upstream {
    zone backend_upstream 64k;
    server backend:8000 resolve;
    keepalive 32;
  }

  # Server blocks are rendered from /etc/nginx/templates/*.template (envsubst) so the
  # HTTP→HTTPS redirect and server_name follow BACKEND_TLS_HOST_PORT / TLS_SERVER_NAME.
  include /etc/nginx/conf.d/*.conf;
}
