name: ${STACK_NAME:-bormostats}

# rotate container logs; the default json-file driver grows without bound on a 24/7 host
x-logging: &default-logging
  driver: json-file
  options:
    max-size: ${LOG_MAX_SIZE:-20m}
    max-file: ${LOG_MAX_FILES:-5}

x-app-runtime: &app-runtime
  restart: unless-stopped
  logging: *default-logging
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  tmpfs:
    - /tmp

services:
  proxy:
    image: nginx:1.31.0-alpine@sha256:2f07d83bf561b506400dc183b1b2003803e39efbd22451f848adaba14d28c7c7
    restart: unless-stopped
    logging: *default-logging
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${BACKEND_HOST_PORT:-18080}:8080"
      - "${BACKEND_TLS_HOST_PORT:-18443}:8443"
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
      - /etc/nginx/conf.d
    environment:
      - BACKEND_TLS_HOST_PORT=${BACKEND_TLS_HOST_PORT:-18443}
      - TLS_SERVER_NAME=${TLS_SERVER_NAME:-localhost}
      - NGINX_ENVSUBST_FILTER=^(BACKEND_TLS_HOST_PORT|TLS_SERVER_NAME)$$
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/templates:/etc/nginx/templates:ro
      - ../nginx/certs:/etc/nginx/certs:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-check-certificate -qO- https://127.0.0.1:8443/health | grep -q '\"status\":\"ok\"'",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    command: ["nginx", "-g", "daemon off;"]
    networks:
      - edge
      - private

  clickhouse:
    # 26.3 LTS: newer ClickHouse builds need AVX2 (x86-64-v3), which the production host
    # (Intel i7-3770) lacks; 26.8 dies with "Illegal instruction". See .github/dependabot.yml.
    image: clickhouse/clickhouse-server:26.3.56.2@sha256:44af0e16ca6217bb45e676aea4d4e8a59d712561127060dde340304d5f439f1a
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:${CH_HTTP_HOST_PORT:-18123}:8123"
    environment:
      - TZ=${TZ:-Europe/Warsaw}
      - CLICKHOUSE_DB=${CH_DB:-mp_analytics}
      - CLICKHOUSE_USER=${BOOTSTRAP_CH_ADMIN_USER:?BOOTSTRAP_CH_ADMIN_USER must be set}
      - CLICKHOUSE_PASSWORD=${BOOTSTRAP_CH_ADMIN_PASSWORD:?BOOTSTRAP_CH_ADMIN_PASSWORD must be set}
      - CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT=1
    volumes:
      - ch_data:/var/lib/clickhouse
      - ./clickhouse/initdb:/docker-entrypoint-initdb.d:ro
      - ./clickhouse/config.d/backups.xml:/etc/clickhouse-server/config.d/backups.xml:ro
      # optional configs:
      # - ./clickhouse/config.xml:/etc/clickhouse-server/config.d/config.xml:ro
      # - ./clickhouse/users.xml:/etc/clickhouse-server/users.d/users.xml:ro
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    mem_limit: ${CLICKHOUSE_MEMORY_LIMIT:-2g}
    mem_reservation: ${CLICKHOUSE_MEMORY_RESERVATION:-512m}
    cpus: ${CLICKHOUSE_CPU_LIMIT:-2.0}
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8123/ping | grep -q Ok"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - ops
      - private

  redis:
    image: redis:8.10.2@sha256:2c2dff791878316e3b083188be0d578423b24813cdda5de0e80ea4f7b3e6bfd6
    restart: unless-stopped
    logging: *default-logging
    environment:
      - REDIS_USERNAME=${REDIS_USERNAME:-bormostats}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    volumes:
      - redis_data:/data
      - ./redis/start.sh:/usr/local/bin/bormostats-redis-start.sh:ro
    entrypoint: ["sh", "/usr/local/bin/bormostats-redis-start.sh"]
    mem_limit: ${REDIS_MEMORY_LIMIT:-512m}
    mem_reservation: ${REDIS_MEMORY_RESERVATION:-128m}
    cpus: ${REDIS_CPU_LIMIT:-0.5}
    healthcheck:
      # REDISCLI_AUTH keeps the password out of the command line
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli --user \"$$REDIS_USERNAME\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks:
      - private

  backend:
    <<: *app-runtime
    build:
      context: ../../
      dockerfile: backend/Dockerfile
    env_file:
      # relative to this file; must name the same file as --env-file (see docs/environments.md)
      - ${APP_ENV_FILE:-../../.env}
    environment:
      - REDIS_USERNAME=${REDIS_USERNAME:-bormostats}
      - EXPORT_DIR=/exports
    volumes:
      - exports:/exports
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    stop_grace_period: 30s
    mem_limit: ${BACKEND_MEMORY_LIMIT:-512m}
    mem_reservation: ${BACKEND_MEMORY_RESERVATION:-128m}
    cpus: ${BACKEND_CPU_LIMIT:-1.0}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5).read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--proxy-headers",
        "--forwarded-allow-ips",
        "*",
        "--timeout-graceful-shutdown",
        "20",
      ]
    networks:
      - private

  worker:
    <<: *app-runtime
    build:
      context: ../../
      dockerfile: workers/Dockerfile
    env_file:
      # relative to this file; must name the same file as --env-file (see docs/environments.md)
      - ${APP_ENV_FILE:-../../.env}
    environment:
      - CELERY_METRICS_ROLE=worker
      - CELERY_METRICS_PORT=9101
      - WORKER_PROMETHEUS_MULTIPROC_DIR=/tmp/bormostats-prometheus/worker
      - REDIS_USERNAME=${REDIS_USERNAME:-bormostats}
      - EXPORT_DIR=/exports
    volumes:
      - exports:/exports
    # Celery finishes running tasks on SIGTERM (warm shutdown); acks_late re-queues
    # anything that is still unfinished when the grace period ends.
    stop_grace_period: 120s
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WORKER_METRICS_HOST_PORT:-19101}:9101"
    mem_limit: ${WORKER_MEMORY_LIMIT:-1g}
    mem_reservation: ${WORKER_MEMORY_RESERVATION:-256m}
    cpus: ${WORKER_CPU_LIMIT:-2.0}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9101/metrics', timeout=5).read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    command:
      [
        "celery",
        "-A",
        "app.celery_app:celery_app",
        "worker",
        "--loglevel=INFO",
        "--concurrency=${WORKER_CONCURRENCY:-4}",
        "--queues=${WORKER_QUEUES:-etl,wb,ozon,competitor,automation,marketplace_actions,webhooks}",
      ]
    networks:
      - ops
      - private

  beat:
    <<: *app-runtime
    build:
      context: ../../
      dockerfile: workers/Dockerfile
    env_file:
      # relative to this file; must name the same file as --env-file (see docs/environments.md)
      - ${APP_ENV_FILE:-../../.env}
    environment:
      - CELERY_METRICS_ROLE=beat
      - CELERY_METRICS_PORT=9102
      - REDIS_USERNAME=${REDIS_USERNAME:-bormostats}
    stop_grace_period: 30s
    depends_on:
      clickhouse:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:${BEAT_METRICS_HOST_PORT:-19102}:9102"
    mem_limit: ${BEAT_MEMORY_LIMIT:-256m}
    mem_reservation: ${BEAT_MEMORY_RESERVATION:-64m}
    cpus: ${BEAT_CPU_LIMIT:-0.5}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:9102/health\", timeout=5).read()'",
        ]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    command:
      [
        "celery",
        "-A",
        "app.celery_app:celery_app",
        "beat",
        "--loglevel=INFO",
        "--schedule=/tmp/celerybeat-schedule",
      ]
    networks:
      - ops
      - private

  metabase:
    image: metabase/metabase@sha256:0d6ac34cfc8b33b2d471ea4c10209c31e3fe073d53ad5c6a8e7da72d3087d6e5
    restart: unless-stopped
    logging: *default-logging
    ports:
      - "127.0.0.1:${METABASE_HOST_PORT:-13000}:3000"
    environment:
      - MB_DB_FILE=/metabase-data/metabase.db
      - JAVA_TIMEZONE=${TZ:-Europe/Warsaw}
      # If plugins needed:
      # - MB_PLUGINS_DIR=/plugins
    volumes:
      - metabase_data:/metabase-data
      # Optional plugin dir:
      # - ./metabase/plugins:/plugins:ro
    mem_limit: ${METABASE_MEMORY_LIMIT:-1g}
    mem_reservation: ${METABASE_MEMORY_RESERVATION:-256m}
    cpus: ${METABASE_CPU_LIMIT:-1.0}
    depends_on:
      clickhouse:
        condition: service_healthy
    networks:
      - ops
      - private

volumes:
  ch_data:
  redis_data:
  metabase_data:
  exports:

networks:
  edge:
  ops:
  private:
    internal: true
