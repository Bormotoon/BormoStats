name: turnover_alert
query: |
  WITH
    sales AS (
      SELECT marketplace, account_id, product_id, sum(qty) / 14 AS avg_daily_sales
      FROM mrt_sales_daily
      WHERE day >= today() - 14
      GROUP BY marketplace, account_id, product_id
    ),
    stock AS (
      SELECT marketplace, account_id, product_id, sum(stock_end) AS avg_stock
      FROM mrt_stock_daily
      WHERE day = (SELECT max(day) FROM mrt_stock_daily)
      GROUP BY marketplace, account_id, product_id
    )
  SELECT
    s.marketplace AS marketplace,
    s.account_id AS account_id,
    s.product_id AS product_id,
    st.avg_stock AS avg_stock,
    s.avg_daily_sales AS avg_daily_sales,
    if(s.avg_daily_sales > 0, st.avg_stock / s.avg_daily_sales, 999) AS turnover_days
  FROM sales AS s
  INNER JOIN stock AS st USING (marketplace, account_id, product_id)
condition: row.get("turnover_days", 999) < params.get("threshold", 10)
params:
  threshold: 10
actions:
  - type: telegram
    template: "⚠️ Быстрая оборачиваемость: {marketplace}/{account_id}/{product_id} — {turnover_days:.0f} дней. Остаток: {avg_stock:.0f}, среднедневные продажи: {avg_daily_sales:.0f}. Рекомендуется поставка > {avg_daily_sales:.0f} шт."
