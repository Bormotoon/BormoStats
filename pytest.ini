[pytest]
pythonpath = .
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -x --tb=short --no-header -q
filterwarnings =
    error
    ignore:.*The 'u' type code is deprecated.*:DeprecationWarning
    ignore::pytest.PytestRemovedIn10Warning
    ignore::pytest.PytestDeprecationWarning
    ignore::DeprecationWarning:clickhouse_connect.*:
    ignore::DeprecationWarning:distributed.*:
    ignore::DeprecationWarning:celery.*:
