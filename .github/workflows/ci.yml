name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: MyPy
        # backend/app и workers/app — ДВА разных пакета с именем `app`. В одном
        # прогоне mypy разрешал `app.*` только в backend, и весь workers/ ловил
        # выдуманные attr-defined/import-not-found. Деревья проверяем по отдельности:
        # backend-сторона от этого стала полностью зелёной (было 23 ложных ошибки).
        run: |
          MYPYPATH=backend mypy backend collectors automation warehouse scripts
          MYPYPATH=workers mypy workers

      - name: Pytest
        run: pytest -q

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build backend image
        run: docker build -f backend/Dockerfile .

      - name: Build worker image
        run: docker build -f workers/Dockerfile .

  supply-chain:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependency audit tool
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit

      - name: Python dependency vulnerability scan
        continue-on-error: true
        run: pip-audit -r requirements.txt -r requirements-dev.txt

      - name: Build backend image
        run: docker build -t bormostats-backend:ci -f backend/Dockerfile .

      - name: Build worker image
        run: docker build -t bormostats-worker:ci -f workers/Dockerfile .

      - name: Generate source SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: ./source-sbom.spdx.json
          artifact-name: bormostats-source-sbom

      - name: Generate backend image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: bormostats-backend:ci
          format: spdx-json
          output-file: ./backend-image-sbom.spdx.json
          artifact-name: bormostats-backend-image-sbom

      - name: Generate worker image SBOM
        uses: anchore/sbom-action@v0
        with:
          image: bormostats-worker:ci
          format: spdx-json
          output-file: ./worker-image-sbom.spdx.json
          artifact-name: bormostats-worker-image-sbom

      - name: Scan backend image
        id: scan-backend
        continue-on-error: true
        uses: anchore/scan-action@v7
        with:
          image: bormostats-backend:ci
          fail-build: false
          severity-cutoff: high
          only-fixed: true
          cache-db: true

      - name: Scan worker image
        id: scan-worker
        continue-on-error: true
        uses: anchore/scan-action@v7
        with:
          image: bormostats-worker:ci
          fail-build: false
          severity-cutoff: high
          only-fixed: true
          cache-db: true

  migration-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare env
        run: |
          cp .env.example .env
          python - <<'PY'
          from pathlib import Path

          env_path = Path(".env")
          updates = {
              "STACK_NAME": "bormostats-ci",
              "CH_HTTP_HOST_PORT": "18123",
              "BOOTSTRAP_CH_HOST": "127.0.0.1",
              "BOOTSTRAP_CH_PORT": "18123",
              "BOOTSTRAP_CH_ADMIN_USER": "bootstrap_ci",
              "BOOTSTRAP_CH_ADMIN_PASSWORD": "ci-bootstrap-admin-password",
              "CH_USER": "analytics_ci",
              "CH_PASSWORD": "ci-clickhouse-password",
              "ADMIN_API_KEY": "ci-admin-api-key",
          }

          lines: list[str] = []
          seen: set[str] = set()
          for raw_line in env_path.read_text(encoding="utf-8").splitlines():
              stripped = raw_line.strip()
              if not stripped or stripped.startswith("#") or "=" not in raw_line:
                  lines.append(raw_line)
                  continue
              key, _, _ = raw_line.partition("=")
              if key in updates:
                  lines.append(f"{key}={updates[key]}")
                  seen.add(key)
                  continue
              lines.append(raw_line)

          for key, value in updates.items():
              if key not in seen:
                  lines.append(f"{key}={value}")

          env_path.write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Start ClickHouse and Redis
        run: |
          docker compose --env-file .env -f infra/docker/docker-compose.yml up -d clickhouse redis

      - name: Wait for ClickHouse
        run: |
          set -a
          source .env
          set +a
          for i in {1..60}; do
            if curl -fsS "http://${BOOTSTRAP_CH_HOST}:${BOOTSTRAP_CH_PORT}/ping" >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose --env-file .env -f infra/docker/docker-compose.yml logs clickhouse
          exit 1

      - name: Provision ClickHouse users
        run: |
          set -a
          source .env
          set +a
          APP_CH_USER="$CH_USER" \
          APP_CH_PASSWORD="$CH_PASSWORD" \
          APP_CH_DB="$CH_DB" \
          APP_CH_RO_USER="${CH_RO_USER:-}" \
          APP_CH_RO_PASSWORD="${CH_RO_PASSWORD:-}" \
          CH_HOST="${BOOTSTRAP_CH_HOST}" \
          CH_PORT="${BOOTSTRAP_CH_PORT}" \
          CH_USER="${BOOTSTRAP_CH_ADMIN_USER:-default}" \
          CH_PASSWORD="${BOOTSTRAP_CH_ADMIN_PASSWORD:-}" \
          python scripts/provision_clickhouse_users.py

      - name: Apply migrations
        run: |
          set -a
          source .env
          set +a
          CH_HOST="${BOOTSTRAP_CH_HOST}" \
          CH_PORT="${BOOTSTRAP_CH_PORT}" \
          python warehouse/apply_migrations.py

      - name: Verify schema
        run: |
          set -a
          source .env
          set +a
          python - <<'PY'
          import os
          import clickhouse_connect

          client = clickhouse_connect.get_client(
              host=os.getenv("BOOTSTRAP_CH_HOST", "127.0.0.1"),
              port=int(os.getenv("BOOTSTRAP_CH_PORT", "8123")),
              username=os.getenv("CH_USER", "default"),
              password=os.getenv("CH_PASSWORD", ""),
              database=os.getenv("CH_DB", "mp_analytics"),
          )
          try:
              rows = client.query(
                  """
                  SELECT name
                  FROM system.tables
                  WHERE database = %(db)s
                    AND name IN %(names)s
                  ORDER BY name
                  """,
                  parameters={
                      "db": os.getenv("CH_DB", "mp_analytics"),
                      "names": ("sys_schema_migrations", "sys_watermarks", "stg_sales", "mrt_sales_daily"),
                  },
              ).result_rows
              if len(rows) != 4:
                  raise SystemExit(f"Expected 4 key tables, got {rows}")
              applied = client.query("SELECT count() FROM sys_schema_migrations").result_rows
              if not applied or int(applied[0][0]) <= 0:
                  raise SystemExit("No migration versions were recorded in sys_schema_migrations")
              print("Schema verification passed")
          finally:
              client.close()
          PY

      - name: Stop services
        if: always()
        run: |
          docker compose --env-file .env -f infra/docker/docker-compose.yml down -v
