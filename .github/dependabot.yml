version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  # requirements.in → requirements.txt (pip-compile style lock with hashes)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # one weekly PR for minor and patch updates instead of one per package: the lock files
    # conflict between them, so separate PRs had to be merged one rebase at a time.
    # Major versions and security updates still come as their own PRs.
    groups:
      python-minor:
        update-types: ["minor", "patch"]
    ignore:
      # FastAPI 0.143 no longer copies included routes into app.routes: route templates in
      # the audit trail and metrics lose /api/v1, and the auth-matrix test sees one route.
      # Lift once both read routes from a public source (see the closed PR #52).
      - dependency-name: "fastapi"
        versions: [">= 0.136"]
      # clickhouse-connect 1.x hands pool ownership to its backend at construction, so the
      # client._owns_pool_manager flag set in backend/app/db/ch.py no longer frees the pool on
      # close() (test_closing_a_built_client_releases_its_pool, see the closed PR #63).
      - dependency-name: "clickhouse-connect"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      frontend-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/workers"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker-compose"
    directory: "/infra/docker"
    schedule:
      interval: "weekly"
    ignore:
      # The production host (Intel i7-3770) has no AVX2; ClickHouse builds after 26.3 need
      # x86-64-v3 and die with "Illegal instruction" (26.8 checked). Keep the 26.3 LTS
      # patch releases; lift this when the server is replaced.
      - dependency-name: "clickhouse/clickhouse-server"
        versions: [">= 26.4"]
