version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns: ["*"]

  # requirements.in → requirements.txt (pip-compile style lock with hashes)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
    groups:
      frontend-minor:
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directories:
      - "/backend"
      - "/workers"
    schedule:
      interval: "weekly"

  - package-ecosystem: "docker-compose"
    directory: "/infra/docker"
    schedule:
      interval: "weekly"
    ignore:
      # The production host (Intel i7-3770) has no AVX2; ClickHouse builds after 26.3 need
      # x86-64-v3 and die with "Illegal instruction" (26.8 checked). Keep the 26.3 LTS
      # patch releases; lift this when the server is replaced.
      - dependency-name: "clickhouse/clickhouse-server"
        versions: [">= 26.4"]
