<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>BormoStats</title>
  <style>
    body { width: 300px; font-family: sans-serif; padding: 12px; }
    h2 { margin: 0 0 8px; font-size: 16px; }
    label { display: block; margin: 8px 0 4px; font-size: 12px; color: #555; }
    input { width: 100%; padding: 6px; box-sizing: border-box; }
    button { margin-top: 8px; width: 100%; padding: 8px; background: #4f46e5; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
    .status { margin-top: 8px; font-size: 12px; color: #666; }
  </style>
</head>
<body>
  <h2>BormoStats</h2>
  <label>API URL</label>
  <input type="text" id="apiUrl" placeholder="https://your-instance/api/v1/plugin/product">
  <label>API Key</label>
  <input type="password" id="apiKey" placeholder="Admin API key">
  <button id="save">Save</button>
  <div class="status" id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
