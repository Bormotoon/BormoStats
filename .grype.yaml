# Temporary Grype suppressions for CPython runtime issues with no released fix.
# Owner: BormoStats maintainers
# Review by: 2027-01-15
# Grype (2026-10-17) still reports CVE-2025-15367 on both 3.14.8 and 3.15.0; re-scan the
# next 3.14.x / 3.15.x image and drop the waiver once it is clean.
ignore:
  - vulnerability: CVE-2025-15367
    reason: >-
      Command injection through newlines in CPython's poplib (CVSS 4.0 5.9). Reported on
      every released CPython image, 3.15.0 included; BormoStats never imports poplib.
    package:
      name: python
      type: binary
      location: /usr/local/bin/python3.14
  - vulnerability: CVE-2026-103995
    reason: >-
      CPython HTTP chunk parsing handles non-hex integers incorrectly (CVSS low); fixed in
      3.16.0; BormoStats HTTP clients use httpx and urllib3.
    package:
      name: python
      type: binary
      location: /usr/local/bin/python3.14
  - vulnerability: CVE-2026-119170
    reason: >-
      CPython 3.14.10 hashlib FIPS enforcement regression; fixed in 3.14.11 (unreleased);
      BormoStats does not use OpenSSL in FIPS mode.
    package:
      name: python
      type: binary
      location: /usr/local/bin/python3.14
  - vulnerability: CVE-2026-124249
    reason: >-
      CPython http.cookiejar cookie deletion policy (RFC 6265); fixed in 3.16.0;
      BormoStats uses httpx rather than urllib cookiejar.
    package:
      name: python
      type: binary
      location: /usr/local/bin/python3.14
  - vulnerability: CVE-2026-116566
    reason: >-
      CPython socket.getaddrinfo null bytes in host/port; fixed in 3.16.0;
      BormoStats never passes null-byte hostnames.
    package:
      name: python
      type: binary
      location: /usr/local/bin/python3.14
  - vulnerability: CVE-2026-115559
    reason: >-
      CPython imaplib STARTTLS buffer injection; fixed in 3.16.0;
      BormoStats does not use IMAP.
    package:
      name: python
      type: binary
      location: /usr/local/bin/python3.14
  - vulnerability: CVE-2026-115791
    reason: >-
      CPython tarfile/zipfile CLI sys.path script execution; fixed in 3.16.0;
      BormoStats does not invoke the python -m tarfile/zipfile CLI.
    package:
      name: python
      type: binary
      location: /usr/local/bin/python3.14
  - vulnerability: CVE-2026-16052
    reason: >-
      CPython http.cookies Morsel semicolon handling; fixed in 3.16.0;
      BormoStats does not use http.cookies Morsel.
    package:
      name: python
      type: binary
      location: /usr/local/bin/python3.14
  - vulnerability: CVE-2026-19552
    reason: >-
      CPython ssl.get_server_certificate ca_certs verification; fixed in 3.16.0;
      BormoStats uses httpx/urllib3 with proper SSL context.
    package:
      name: python
      type: binary
      location: /usr/local/bin/python3.14
