# Temporary Grype suppressions for CPython runtime issues with no released fix.
# Owner: BormoStats maintainers
# Review by: 2027-01-15
# Grype (2026-10-17) still reports CVE-2025-15367 on both 3.14.8 and 3.15.0; re-scan the
# next 3.14.x / 3.15.x image and drop the waiver once it is clean.
ignore:
  - vulnerability: CVE-2025-15367
    reason: >-
      Command injection through newlines in CPython's poplib (CVSS 4.0 5.9). Reported on
      every released CPython image, 3.15.0 included; BormoStats never imports poplib.
    package:
      name: python
      type: binary
      location: /usr/local/bin/python3.14
  - vulnerability: CVE-2026-103995
    reason: >-
      CPython HTTP chunk parsing handles non-hex integers incorrectly (CVSS low); fixed in
      3.16.0; BormoStats HTTP clients use httpx and urllib3.
    package:
      name: python
      type: binary
      location: /usr/local/bin/python3.14
